<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zero-Auth AI Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- JSZip for extracting ZIP files -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <!-- Marked.js for rendering Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- Highlight.js for Code Syntax Highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <style>
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #111827; }
    ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }

    /* Markdown styling inside chat bubbles */
    .markdown-body p { margin-bottom: 0.75rem; }
    .markdown-body p:last-child { margin-bottom: 0; }
    .markdown-body ul { list-style-type: disc; padding-left: 1.25rem; margin-bottom: 0.75rem; }
    .markdown-body ol { list-style-type: decimal; padding-left: 1.25rem; margin-bottom: 0.75rem; }
    .markdown-body h1, .markdown-body h2, .markdown-body h3 { font-weight: 700; margin-top: 1rem; margin-bottom: 0.5rem; }
    .markdown-body blockquote { border-left: 3px solid #6366f1; padding-left: 0.75rem; color: #9ca3af; margin-bottom: 0.75rem; background: rgba(255,255,255,0.03); padding-top: 0.25rem; padding-bottom: 0.25rem; border-radius: 0 0.375rem 0.375rem 0; }
    .markdown-body code:not(pre code) { background-color: rgba(255, 255, 255, 0.1); padding: 0.15rem 0.35rem; border-radius: 0.25rem; font-family: monospace; font-size: 0.85em; }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="p-4 border-b border-gray-800 flex justify-between items-center bg-gray-950">
    <div class="flex items-center gap-3">
      <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
      <h1 class="text-lg font-semibold tracking-wide text-gray-100">Zero-Auth AI Assistant</h1>
    </div>
    <div class="flex items-center gap-2">
      <label for="model-select" class="text-xs text-gray-400 hidden sm:inline">Model:</label>
      <select id="model-select" class="bg-gray-800 border border-gray-700 rounded-lg text-xs sm:text-sm px-3 py-1.5 focus:outline-none focus:border-indigo-500 text-gray-200">
        <option value="openai" selected>GPT-4o (OpenAI)</option>
        <option value="qwen-coder">Qwen 2.5 Coder</option>
        <option value="mistral">Mistral Large</option>
        <option value="llama">Llama 3.3 70B</option>
      </select>
    </div>
  </header>

  <!-- Messages Container -->
  <main id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-4xl w-full mx-auto">
    <div class="flex justify-start">
      <div class="bg-gray-800 border border-gray-700/50 text-gray-200 rounded-2xl rounded-tl-none px-4 py-3 max-w-[85%] text-sm shadow-md">
        Hello! No sign-in or API keys needed. You can chat directly or upload a .zip file to analyze code and text files.
      </div>
    </div>
  </main>

  <!-- Attached ZIP Chip Display -->
  <div id="file-badge-container" class="max-w-4xl w-full mx-auto px-4 hidden">
    <div class="inline-flex items-center gap-2 bg-indigo-950 border border-indigo-700/50 text-indigo-200 px-3 py-1 rounded-full text-xs">
      <span id="badge-file-name">archive.zip</span>
      <button id="remove-zip-btn" class="hover:text-red-400 font-bold ml-1">✕</button>
    </div>
  </div>

  <!-- Input Form -->
  <footer class="p-4 border-t border-gray-800 bg-gray-950">
    <form id="chat-form" class="max-w-4xl mx-auto flex gap-2 items-end">
      <!-- ZIP Upload Button -->
      <label class="cursor-pointer bg-gray-800 hover:bg-gray-700 border border-gray-700 text-gray-300 p-3 rounded-xl flex items-center justify-center transition-colors" title="Upload ZIP">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" />
        </svg>
        <input type="file" id="zip-input" accept=".zip" class="hidden">
      </label>

      <textarea 
        id="user-input" 
        rows="1" 
        placeholder="Type a message or upload a .zip archive..."
        class="flex-1 bg-gray-800 border border-gray-700 rounded-xl p-3 text-sm focus:outline-none focus:border-indigo-500 text-gray-100 resize-none max-h-36"
        required></textarea>
      
      <button 
        type="submit" 
        id="send-btn"
        class="bg-indigo-600 hover:bg-indigo-500 transition-colors text-white font-medium px-5 py-3 rounded-xl text-sm flex items-center justify-center disabled:opacity-50 disabled:cursor-not-allowed">
        Send
      </button>
    </form>
  </footer>

  <script>
    const chatContainer = document.getElementById('chat-container');
    const chatForm = document.getElementById('chat-form');
    const userInput = document.getElementById('user-input');
    const modelSelect = document.getElementById('model-select');
    const sendBtn = document.getElementById('send-btn');
    const zipInput = document.getElementById('zip-input');
    const fileBadgeContainer = document.getElementById('file-badge-container');
    const badgeFileName = document.getElementById('badge-file-name');
    const removeZipBtn = document.getElementById('remove-zip-btn');

    let zipContextData = '';
    let conversationHistory = [];

    // Configure marked to render safe Markdown
    marked.setOptions({
      breaks: true,
      gfm: true
    });

    // Handle ZIP Upload & Extraction
    zipInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      try {
        const zip = await JSZip.loadAsync(file);
        let combinedContent = `\n\n=== ATTACHED ZIP ARCHIVE: ${file.name} ===\n`;
        let processedFiles = 0;

        for (const [relativePath, zipEntry] of Object.entries(zip.files)) {
          if (!zipEntry.dir) {
            const isBinary = /\.(png|jpg|jpeg|gif|ico|pdf|zip|exe|dll|so|dylib|woff|ttf)$/i.test(relativePath);
            if (!isBinary) {
              const textContent = await zipEntry.async('string');
              combinedContent += `\n--- File: ${relativePath} ---\n${textContent}\n`;
              processedFiles++;
            }
          }
        }

        zipContextData = combinedContent;
        badgeFileName.textContent = `${file.name} (${processedFiles} files extracted)`;
        fileBadgeContainer.classList.remove('hidden');
      } catch (err) {
        alert('Failed to read ZIP archive: ' + err.message);
        clearZipAttachment();
      }
    });

    removeZipBtn.addEventListener('click', clearZipAttachment);

    function clearZipAttachment() {
      zipContextData = '';
      zipInput.value = '';
      fileBadgeContainer.classList.add('hidden');
    }

    userInput.addEventListener('input', () => {
      userInput.style.height = 'auto';
      userInput.style.height = Math.min(userInput.scrollHeight, 150) + 'px';
    });

    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        chatForm.dispatchEvent(new Event('submit'));
      }
    });

    function createBubble(role) {
      const wrapper = document.createElement('div');
      wrapper.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'}`;

      const bubble = document.createElement('div');
      bubble.className = role === 'user' 
        ? 'bg-indigo-600 text-white rounded-2xl rounded-tr-none px-4 py-3 max-w-[85%] text-sm shadow-md whitespace-pre-wrap'
        : 'bg-gray-800 border border-gray-700/50 text-gray-200 rounded-2xl rounded-tl-none px-4 py-3 max-w-[90%] sm:max-w-[85%] text-sm shadow-md markdown-body';
      
      wrapper.appendChild(bubble);
      chatContainer.appendChild(wrapper);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return bubble;
    }

    // Function to parse raw input/JSON, render Markdown, format Code Blocks & Copy Buttons
    function renderFormattedContent(element, rawText) {
      let content = rawText.trim();

      // Check if API returned a stringified JSON object
      if (content.startsWith('{') && content.endsWith('}')) {
        try {
          const parsed = JSON.parse(content);
          let parts = [];
          if (parsed.reasoning) {
            parts.push(`> **Reasoning:**\n${parsed.reasoning}`);
          }
          if (parsed.content) {
            parts.push(parsed.content);
          } else if (parsed.text) {
            parts.push(parsed.text);
          } else if (parsed.message?.content) {
            parts.push(parsed.message.content);
          }
          if (parts.length > 0) {
            content = parts.join('\n\n');
          }
        } catch (e) {
          // If JSON parse fails, treat as plain markdown
        }
      }

      // Convert Markdown to HTML
      element.innerHTML = marked.parse(content);

      // Apply Syntax Highlighting to Code Blocks
      element.querySelectorAll('pre code').forEach((block) => {
        hljs.highlightElement(block);
      });

      // Wrap code blocks with container header & copy button
      element.querySelectorAll('pre').forEach((pre) => {
        if (pre.parentNode.classList.contains('code-block-container')) return;

        const code = pre.querySelector('code');
        const langClass = code ? Array.from(code.classList).find(c => c.startsWith('language-')) : '';
        const lang = langClass ? langClass.replace('language-', '') : 'code';

        const container = document.createElement('div');
        container.className = 'code-block-container bg-gray-950 rounded-xl overflow-hidden my-3 border border-gray-700/80 shadow-lg';

        const header = document.createElement('div');
        header.className = 'bg-gray-800/90 px-4 py-1.5 flex justify-between items-center text-xs text-gray-400 border-b border-gray-700/50 font-mono select-none';
        header.innerHTML = `
          <span>${lang}</span>
          <button class="copy-btn hover:text-white flex items-center gap-1 transition-colors px-2 py-0.5 rounded hover:bg-gray-700">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
            Copy
          </button>
        `;

        const copyBtn = header.querySelector('.copy-btn');
        copyBtn.addEventListener('click', () => {
          const codeText = code ? code.innerText : pre.innerText;
          navigator.clipboard.writeText(codeText).then(() => {
            copyBtn.innerHTML = `
              <svg class="w-3.5 h-3.5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
              <span class="text-emerald-400">Copied!</span>
            `;
            setTimeout(() => {
              copyBtn.innerHTML = `
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                Copy
              `;
            }, 2000);
          });
        });

        pre.parentNode.insertBefore(container, pre);
        container.appendChild(header);
        container.appendChild(pre);

        pre.className = 'p-4 overflow-x-auto text-xs sm:text-sm font-mono leading-relaxed bg-transparent m-0';
      });
    }

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const rawPrompt = userInput.value.trim();
      if (!rawPrompt) return;

      const selectedModel = modelSelect.value;
      const fullPrompt = rawPrompt + (zipContextData ? zipContextData : '');

      // User Bubble
      const userBubble = createBubble('user');
      userBubble.textContent = rawPrompt + (zipContextData ? ' [Attached ZIP Archive]' : '');

      userInput.value = '';
      userInput.style.height = 'auto';
      userInput.disabled = true;
      sendBtn.disabled = true;

      clearZipAttachment();

      // Assistant Bubble Placeholder
      const aiBubble = createBubble('assistant');
      aiBubble.textContent = 'Thinking...';

      conversationHistory.push({ role: 'user', content: fullPrompt });

      try {
        const response = await fetch('https://text.pollinations.ai/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            messages: conversationHistory,
            model: selectedModel,
            seed: Math.floor(Math.random() * 100000)
          })
        });

        if (!response.ok) throw new Error('API Request Failed');

        const replyText = await response.text();
        renderFormattedContent(aiBubble, replyText);
        conversationHistory.push({ role: 'assistant', content: replyText });

      } catch (error) {
        aiBubble.textContent = `Error: ${error.message || 'Could not fetch response.'}`;
        aiBubble.classList.add('text-red-400');
      } finally {
        userInput.disabled = false;
        sendBtn.disabled = false;
        userInput.focus();
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }
    });
  </script>
</body>
</html>
